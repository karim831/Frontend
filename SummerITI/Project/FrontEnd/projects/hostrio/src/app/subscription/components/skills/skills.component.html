<!-- Start Skills -->
<div class="our-skills" id="skills">
    <h2 class="main-title">Our Skills</h2>
    <div class="container">
        <img [src]="'./assets/images/'+image" alt="">
        <div class="skills">
            @for (skill of skills; track $index) {
                <div class="skill">
                    <h3>{{skill.skill}} <span>{{skill.percentage}}%</span></h3>
                    <div class="progress">
                        <span [style]="'width: '+skill.percentage+'%;'"></span>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
<!-- End Skills -->

<!-- Start Video -->
<div class="video" id="video">
    <h2 class="main-title">{{title}}</h2>
    <div class="container">
        <div class="holder">
            <div class="list">
                <div class="name">
                    <h4>{{title}}</h4>
                    <i class="fas fa-random"></i>
                </div>
                <ul>
                    @for (section of sections; track $index) {
                        <li>
                            <p>{{section.title}}</p>
                            <span>{{section.time}}</span>
                        </li>
                    }
                </ul>
            </div>
            <div class="preview">
                <img [src]="'./assets/images/'+preview.img">
                <div class="info">{{preview.description}}</div>
            </div>
        </div>
    </div>
</div>
<!-- End Video -->

<!-- Start Gallery -->
    <div class="gallery" id="gallery">
        <h2 class="main-title">{{title}}</h2>
        <div class="container">
            @for (image of images; track $index) {
                <div class="box">
                    <div class="image">
                        <img [src]="'./assets/images/' + image">
                    </div>
                </div>
            }
        </div>
    </div>
    <!-- End Gallery -->

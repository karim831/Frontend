<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var pargraph = "Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ad eos corrupti necessitatibus alias suscipit laborum mollitia vel iste officiis quaerat";
        var pargraphArray = pargraph.split(' ');
        var index = 0;
        var handlerNumber;

        function ShowWord(){
            if(index == pargraphArray.length){
                clearInterval(handlerNumber);
                return;
            }
            document.write(pargraphArray[index++] + " ");
        }

        handlerNumber = setInterval("ShowWord()",1000);
    </script>
</body>
</html>

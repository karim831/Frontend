<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <title>Document</title>
    <style>
        *{  
            box-sizing: border-box;
        }

        .container{
            width: 800px;
            margin: 20px auto;
        }
        h1{
            text-align: center;
            color: #5e2b31;
        }
        .adder{
            height: 40px;
            padding: 0 20px;
        }
        .adder input{
            border-style: none;
            width: 80%;
            height: 100%;
            padding-left: 20px;
            outline: transparent;
            border: 1px #cacaca solid;
            box-shadow: 3px 3px 13px black;
            font-size: 25px;
        }   
        .adder button{
            width: 12%;
            margin-left: 7%;
            height: 100%;
            font-size: 25px;
            border-radius: 20%;
            background-color: #367dd3;
            color: white;
        }

        
        table{
            margin: 20px 0;
            width: 100%;
        }
        th{
            background-color: #cb0c08;
            color: white;
        }
        td{
            color: #a7969a;
        }
        th,td{
            margin: 0 5px;
            text-align: center;
        }
        
        tr > :nth-child(2){
            width: 50%;
        }

        .bi-trash{
            color: #cb0c08;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>To Do Organizer</h1>
        <div class="adder">
            <input type="text">
            <button onclick="addTask()">Add</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Done</th>
                    <th>Task</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        let index = 0;
        let input = document.querySelector(".adder input");
        let tbody = document.querySelector("tbody");

        function addTask(){
            let tr = document.createElement("tr");
            let tds = [];
            for(let i=0;i<3;i++)
                tds.push(document.createElement("td"));
            let tmp = document.createElement("input");tmp.type = "checkbox"; 
            tds[0].appendChild(tmp);
            tds[1].innerText = input.value;
            tds[2].innerHTML = '<i class="bi bi-trash"></i>';
            tds[2].children[0].addEventListener("click",removeTask);
            for(let i=0;i<3;i++){
                if(index % 2)
                    tds[i].style.backgroundColor = "#dad5d6";
                tr.appendChild(tds[i]);
            }
            index++;
            tbody.appendChild(tr);
        }

        function removeTask(e){
            this.parentElement.parentElement.remove();
        }



    </script>
</body>
</html>

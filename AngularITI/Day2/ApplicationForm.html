<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Assets/CSS/ApplicationForm.css">
    <title>Register</title>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="logo"><h1>LOGO</h1></div>
            <div class="links">
                <ul>
                    <li>Company</li>
                    <li>Services</li>
                    <li>FinTech Solutions</li>
                    <li>Products</li>
                    <li>Portfolio</li>
                    <li>Contact us</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="contact-us">
        <div class="container">
            <h1>Contact us</h1>
            <p>Need an experienced and skilled hand with custom IT projects? Fill out this form to get a free consultation</p>
        </div>
    </div>
    <div class="form">
        <div class="container">
            <form method="get">
                <div class="written-section">
                    <input type="text" name="companyName" placeholder="Your Company Name">
                    <input type="text" name="natureOfBusiness" placeholder="Nature Of Business">
                    <div class="address">
                        <input type="text" name="address" placeholder="Address">
                        <input type="text" name="postCode" placeholder="Postcode">
                    </div>
                    <input type="text" name="contactName" placeholder="Contact Name">
                    <input type="tel" name="contactPhone" placeholder="Contact Phone">
                    <input type="email" name="email" placeholder="Email">
                    <input type="text" name="linkedIn" placeholder="Linkedin">
                    <input type="email" name="idea" placeholder="Let's talk about your idea">
                </div>
                <div class="file-section">
                    <label for="file">Upload Additional File</label>
                    <input type="file" name="file" id="file">
                    <p>Attach file. File size of your documents should not exceed 10MG</p>
                </div>
                <button type="submit">SUBMIT</button>
                <input type="checkbox" name="checkProtect" id="checkProtect"> 
                <label for="checkProtect">I want to protect my data by signing an NDA</label>
            </form>
            </div>
        </div>
    </div>
</body>
</html>
